services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: satsim
      POSTGRES_PASSWORD: satsim
      POSTGRES_DB: satsim
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  web:
    build: .
    depends_on: [db, redis]
    environment:
      FLASK_ENV: production
      SECRET_KEY: change-me
      DATABASE_URL: postgresql://satsim:satsim@db:5432/satsim
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports: ["5000:5000"]
    command: >
      sh -c "flask db upgrade &&
             gunicorn -c gunicorn.conf.py flask_app:app"

  worker:
    build: .
    depends_on: [db, redis]
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://satsim:satsim@db:5432/satsim
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A celery_worker.celery worker --loglevel=info

volumes:
  pgdata: {}
